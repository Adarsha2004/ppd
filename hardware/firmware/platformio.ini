; PlatformIO alternative to the Arduino IDE.  Build + flash:  pio run -t upload
; (run from this folder; the sketch lives in ./thermal_streamer)
[platformio]
src_dir = thermal_streamer

[env:esp32s3_n16r8]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
; N16R8 = 16 MB QIO flash + 8 MB octal PSRAM
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
monitor_speed = 921600
lib_deps =
    adafruit/Adafruit MLX90640
